<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' melofi:; script-src 'self' melofi:; style-src 'self' 'unsafe-inline' melofi:; img-src 'self' data: blob: melofi:; media-src 'self' blob: melofi:; connect-src 'self' melofi:; worker-src 'self' melofi:">
<title>MeloFi</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="bar">
  <div class="brand"><svg class="mark" viewBox="56 48 144 168" aria-hidden="true"><rect x="74" y="88" width="26" height="104" rx="13"/><rect x="115" y="56" width="26" height="136" rx="13"/><rect x="156" y="110" width="26" height="82" rx="13"/><rect class="line" x="64" y="200" width="128" height="9" rx="4.5"/></svg>MeloFi</div>

  <nav class="menubar">
    <button data-menu="file" data-t="menu.file"></button>
    <button data-menu="sound" data-t="menu.sound"></button>
    <button data-menu="settings" data-t="menu.settings"></button>
  </nav>

  <div class="readout">
    <div class="cell rec" id="recCell" hidden><span class="dot"></span><b id="recTime">00:00</b><em id="recFmt"></em></div>
    <div class="cell inst"><span id="instName">—</span></div>
    <div class="cell"><label>OCT</label><b id="octVal">4</b></div>
    <div class="cell"><label>TRANS</label><b id="trVal">0</b></div>
    <div class="cell"><label>VEL</label><b id="velVal">90</b></div>
    <div class="cell mod" id="modCell"><b id="modVal"></b></div>
    <button class="cell flag pedal" id="susFlag" title="">SUS</button>
    <span class="cell flag pedal" id="sostFlag" hidden>SOST</span>
    <span class="cell flag pedal" id="softFlag" hidden>SOFT</span>
    <div class="cell metro" id="metroCell" hidden><span class="beats" id="beatDots"></span><b id="bpmVal">100</b></div>
    <div class="cell flag on-dim" id="midiFlag" hidden>MIDI</div>
  </div>
  <button id="fsBtn" class="fs-btn" aria-label="전체화면"><svg viewBox="0 0 12 12"><path d="M1 4V1h3M8 1h3v3M11 8v3H8M4 11H1V8" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
  <div id="progress"><i></i></div>
</header>

<div id="transport" hidden>
  <button id="tpPlay" class="tp-btn" data-t-title="score.play"><i class="ic play"></i></button>
  <button id="tpStop" class="tp-btn" data-t-title="score.stop"><i class="ic stop"></i></button>
  <div class="tp-title" id="tpTitle"></div>
  <div class="tp-legend" id="tpLegend"></div>
  <span class="tp-time" id="tpPos">0:00</span>
  <input type="range" id="tpSeek" min="0" max="1000" step="1" value="0">
  <span class="tp-time" id="tpDur">0:00</span>
  <div class="tp-rate"><button class="btn" id="tpSlower">−</button><b id="tpRate">100%</b><button class="btn" id="tpFaster">+</button></div>
  <button class="btn" id="tpPractice"></button>
  <button class="btn" id="tpParts"></button>
  <button class="btn" id="tpMidi"></button>
  <button class="x" id="tpClose"></button>
</div>

<main id="stageWrap">
  <canvas id="stage"></canvas>
  <div id="renderBox" hidden>
    <div class="card">
      <b class="title" data-t="render.title"></b>
      <div class="phase"></div>
      <div class="bar"><i></i></div>
      <div class="eta"></div>
      <div class="row"><button class="btn" data-act="cancel" data-t="render.cancel"></button></div>
    </div>
  </div>
  <div id="intro" hidden>
    <div class="in"><div class="sub"></div><h1 class="t"></h1><i class="rule"></i><div class="c"></div></div>
    <label class="never"><input type="checkbox"><span data-t="intro.never"></span></label>
  </div>
  <div id="hud" hidden><b class="grade"></b><span class="acc"></span><span class="combo"></span><div class="judge"></div></div>
  <div id="result" hidden>
    <div class="card">
      <div class="big"></div>
      <dl>
        <dt data-t="practice.accuracy"></dt><dd class="acc"></dd>
        <dt data-t="practice.score"></dt><dd class="score"></dd>
        <dt data-t="practice.maxCombo"></dt><dd class="combo"></dd>
      </dl>
      <ul class="counts">
        <li data-kind="perfect"><span data-t="practice.perfect"></span><b class="n-perfect"></b></li>
        <li data-kind="great"><span data-t="practice.great"></span><b class="n-great"></b></li>
        <li data-kind="good"><span data-t="practice.good"></span><b class="n-good"></b></li>
        <li data-kind="miss"><span data-t="practice.miss"></span><b class="n-miss"></b></li>
      </ul>
      <div class="row"><button class="btn" data-act="again" data-t="practice.again"></button><button class="btn" data-act="close" data-t="practice.close"></button></div>
    </div>
  </div>
</main>

<div id="menu" class="menu" role="menu" hidden></div>

<aside id="settings" class="drawer" hidden>
  <div class="drawer-head">
    <h2 data-t="settings.title"></h2>
    <button class="x" data-close aria-label="닫기"></button>
  </div>
  <div class="tabs" role="tablist"></div>
  <div class="drawer-body"></div>
</aside>

<section id="help" class="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><h2 data-t="help.title"></h2><button class="x" data-close aria-label="닫기"></button></div>
    <div class="help-grid"></div>
    <p class="help-foot"></p>
  </div>
</section>

<section id="keymap" class="sheet" hidden>
  <div class="sheet-card wide">
    <div class="sheet-head"><h2 data-t="keymap.title"></h2><button class="x" data-close aria-label="닫기"></button></div>
    <div class="km-tools">
      <label><span data-t="keymap.preset"></span> <select id="kmPreset"></select></label>
      <span class="spacer"></span>
      <button id="kmClear" class="btn" data-t="keymap.clear"></button>
      <button id="kmReset" class="btn" data-t="keymap.reset"></button>
    </div>
    <div class="km-board"></div>
    <p class="km-hint" data-t="keymap.hint"></p>
    <div class="km-piano"></div>
  </div>
</section>

<section id="mixer" class="sheet" hidden>
  <div class="sheet-card mixer-card">
    <div class="sheet-head"><h2 data-t="mixer.title"></h2><button class="x" data-close aria-label="닫기"></button></div>
    <div class="mixer-body"></div>
  </div>
</section>

<div id="toasts"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
