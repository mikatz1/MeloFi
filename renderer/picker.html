<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' melofi:; style-src 'self' 'unsafe-inline' melofi:; img-src 'self' melofi: data:">
  <title>악기 선택</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="picker.css">
</head>
<body class="picker">
<header id="bar">
  <div class="brand"><svg class="mark" viewBox="56 48 144 168" aria-hidden="true"><rect x="74" y="88" width="26" height="104" rx="13"/><rect x="115" y="56" width="26" height="136" rx="13"/><rect x="156" y="110" width="26" height="82" rx="13"/><rect class="line" x="64" y="200" width="128" height="9" rx="4.5"/></svg></div>
  <span class="pk-title">악기 선택</span><span id="pkFor" class="pk-for"></span>
</header>
<main class="pk">
  <div class="pk-top">
    <input id="pkSearch" type="search" placeholder="악기 검색 (한글·영어·초성)" autocomplete="off" spellcheck="false">
    <label class="pk-only"><input id="pkInstalled" type="checkbox"> 설치된 악기만</label>
  </div>
  <nav id="pkFam" class="pk-fam"></nav>
  <ul id="pkList" class="pk-list" role="listbox" tabindex="0"></ul>
  <footer class="pk-foot">
    <span id="pkHint" class="pk-hint"></span>
    <button id="pkStore" class="pk-btn">다운로드 센터</button>
  </footer>
</main>
<script type="module" src="js/picker.js"></script>
</body>
</html>
